[package]
name = "tyrian_companion_nexus_core"
version = "0.1.0"
edition = "2021"
authors = ["fodaveg"]
description = "Platform-independent logic for the Tyrian Companion Nexus addon: the wire protocol, the line framer, the reconnect backoff table, settings persistence, and shared state. No `nexus` or `windows` dependency, so this builds and tests on any host."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
